name: Drift Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-check:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        run: terraform init
        env:
          TF_IN_AUTOMATION: true

      - name: Terraform Plan (drift detection)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=drift.tfplan 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Exit code: $EXIT_CODE"
          exit 0
        env:
          TF_IN_AUTOMATION: true

      - name: Evaluate drift result
        id: evaluate
        run: |
          EXIT_CODE="${{ steps.plan.outputs.exit_code }}"
          case "$EXIT_CODE" in
            0)
              echo "status=no_drift" >> $GITHUB_OUTPUT
              echo "✅ No drift detected — infrastructure matches Terraform configuration."
              ;;
            2)
              echo "status=drift_detected" >> $GITHUB_OUTPUT
              echo "⚠️ DRIFT DETECTED — live infrastructure differs from Terraform configuration!"
              ;;
            1)
              echo "status=error" >> $GITHUB_OUTPUT
              echo "❌ Terraform plan failed — check credentials and provider configuration."
              exit 1
              ;;
            *)
              echo "status=unknown" >> $GITHUB_OUTPUT
              echo "❓ Unexpected exit code: $EXIT_CODE"
              exit 1
              ;;
          esac

      - name: Read plan output
        if: steps.evaluate.outputs.status == 'drift_detected'
        id: plan_output
        run: |
          PLAN_CONTENT=$(cat plan_output.txt | head -200)
          echo "plan_content<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create drift PR
        if: steps.evaluate.outputs.status == 'drift_detected'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(drift): detected infrastructure drift at ${{ github.run_id }}"
          branch: "infrasage/drift-remediation-${{ github.run_number }}"
          delete-branch: true
          title: "[InfraSage] ⚠️ Infrastructure Drift Detected"
          body: |
            ## Infrastructure Drift Detected

            The scheduled drift check found that the live infrastructure **differs** from the
            Terraform configuration in this repository.

            **Detected at:** ${{ github.event.head_commit.timestamp || 'scheduled run' }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Terraform Plan Output

            <details>
            <summary>Click to expand plan output</summary>

            ```
            ${{ steps.plan_output.outputs.plan_content }}
            ```

            </details>

            ### How to fix

            1. Review the plan output above
            2. If the drift is expected (someone made a manual change), update the `.tf` files to match
            3. If the drift is unexpected (someone manually changed infrastructure), merge this PR
               to trigger Digger's `terraform apply` and restore the desired state
            4. After merge, the next drift check will confirm no more drift

            ---
            *Auto-generated by [InfraSage](https://github.com/Sahil0114/infrasage1) drift detection*
          labels: |
            drift
            terraform
            infrasage

      - name: Notify on error
        if: steps.evaluate.outputs.status == 'error'
        run: |
          echo "::error::Terraform plan failed during drift check. Check AWS credentials and provider configuration."
          exit 1

      - name: Summary
        if: always()
        run: |
          STATUS="${{ steps.evaluate.outputs.status }}"
          echo "## Drift Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          case "$STATUS" in
            no_drift)
              echo "✅ **No drift detected** — infrastructure matches Terraform configuration." >> $GITHUB_STEP_SUMMARY
              ;;
            drift_detected)
              echo "⚠️ **Drift detected** — a pull request has been created for remediation." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Review and merge the auto-generated PR to restore desired state." >> $GITHUB_STEP_SUMMARY
              ;;
            error)
              echo "❌ **Terraform plan failed** — check credentials and provider configuration." >> $GITHUB_STEP_SUMMARY
              ;;
          esac
