name: InfraSage CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/infrasage-ci.yml'
  push:
    branches: [main]
    paths:
      - '**.tf'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  security-scan:
    name: Security Scan (Checkov + tfsec + Terrascan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      # ── Checkov ────────────────────────────────────────────────────────────
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true
          download_external_modules: false

      # ── tfsec ──────────────────────────────────────────────────────────────
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true
          format: lovely

      # ── Terrascan ──────────────────────────────────────────────────────────
      - name: Run Terrascan
        id: terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_version: v14
          policy_type: aws
          only_warn: true

      # ── Summary comment on PR ──────────────────────────────────────────────
      - name: Post scan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🔍 InfraSage Security Scan Results

            | Scanner   | Status |
            |-----------|--------|
            | Checkov   | ${{ steps.checkov.outcome == 'success' && '✅ Passed' || '⚠️ Findings' }} |
            | tfsec     | ✅ Complete |
            | Terrascan | ${{ steps.terrascan.outcome == 'success' && '✅ Passed' || '⚠️ Findings' }} |

            Review the **Actions** tab for detailed findings.
            Generated by [InfraSage](https://github.com/${{ github.repository }}) 🤖`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  terraform-dryrun:
    name: Terraform Dry Run (No AWS Required)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init (backend disabled)
        run: terraform init -backend=false -input=false
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        continue-on-error: true

      - name: Terraform Plan (simulation mode)
        id: plan
        run: |
          terraform plan -no-color -input=false -refresh=false -lock=false -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            } catch (e) {
              planOutput = 'Plan output not available.';
            }
            // Truncate if too long for a PR comment
            if (planOutput.length > 60000) {
              planOutput = planOutput.substring(0, 60000) + '\n... (truncated)';
            }
            const body = `## ⚙️ Terraform Plan

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`
            ${planOutput}
            \`\`\`

            </details>

            > ℹ️ **Simulation mode:** This CI plan is a non-destructive dry run intended for repos without cloud credentials.
            > Real cloud apply is optional and only runs when AWS secrets are configured.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
