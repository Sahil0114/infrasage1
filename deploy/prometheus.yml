# Prometheus configuration for InfraSage
# Scrapes metrics from the infrasage CLI binary running on the host machine.
# host.docker.internal resolves to the Mac host from inside Docker Desktop containers.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'infrasage'

scrape_configs:
  - job_name: 'infrasage-cli'
    static_configs:
      - targets: ['host.docker.internal:2112']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
